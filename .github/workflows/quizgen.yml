name: Daily quiz generation

on:
  schedule:
    - cron: '15 2 * * *'   # every day, 02:15 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated country codes (empty = all)'
        required: false
        default: ''
      force:
        description: 'Regenerate content that already exists'
        type: boolean
        default: false

concurrency:
  group: quizgen
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/quizgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/quizgen/requirements.txt

      - run: pip install -r requirements.txt

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase.json" >> "$GITHUB_ENV"

      - name: Generate and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COUNTRIES: ${{ inputs.countries }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "$COUNTRIES" ]; then ARGS="$ARGS --countries $COUNTRIES"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python generate.py $ARGS
