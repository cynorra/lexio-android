name: Daily quiz generation

on:
  schedule:
    # 09:15 UTC = 02:15 Pacific: after Gemini's daily free quota resets (midnight Pacific), so a run never
    # starts on yesterday's exhausted quota.
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated country codes (empty = all)'
        required: false
        default: ''
      exams:
        description: 'Comma-separated exam ids, e.g. us-ube,tr-hmgs (empty = all exams when countries is empty, else none; "none" = no exams)'
        required: false
        default: ''
      force:
        description: 'Regenerate content that already exists'
        type: boolean
        default: false
      model:
        description: 'Model that writes the content (empty = gemini-3.5-flash-lite), e.g. gemini-3.8-flash'
        required: false
        default: ''
      check_only:
        description: 'Only audit the stored content (read-only): does the app get valid quizzes and study sets?'
        type: boolean
        default: false
      min_interval:
        description: 'Seconds between model calls (empty = 4; use 0 on a paid key)'
        required: false
        default: ''
      verify_model:
        description: 'Model that fact-checks it (empty = same as model)'
        required: false
        default: ''

concurrency:
  group: quizgen
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/quizgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/quizgen/requirements.txt

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest test_generate test_manual test_cases

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase.json" >> "$GITHUB_ENV"

      - name: Generate and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          COUNTRIES: ${{ inputs.countries }}
          EXAMS: ${{ inputs.exams }}
          QUIZGEN_MODEL: ${{ inputs.model }}
          QUIZGEN_VERIFY_MODEL: ${{ inputs.verify_model }}
          QUIZGEN_MIN_INTERVAL: ${{ inputs.min_interval }}
          CHECK_ONLY: ${{ inputs.check_only }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "$COUNTRIES" ]; then ARGS="$ARGS --countries $COUNTRIES"; fi
          if [ -n "$EXAMS" ]; then ARGS="$ARGS --exams $EXAMS"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$CHECK_ONLY" = "true" ]; then ARGS="$ARGS --check"; fi
          python generate.py $ARGS
